[package]
name = "workflow-media"
version = "0.8.6"
default-run = "workflow-media"
edition = "2024"
rust-version = "1.95"
description = "WorkFlow Media: portable desktop downloads and media library"
license = "MIT"
build = "build.rs"

[features]
setup-stub = []
setup-builder = []
update-helper = ["setup-stub"]

[[bin]]
name = "workflow-setup"
path = "src/bin/workflow-setup.rs"
required-features = ["setup-stub"]

[[bin]]
name = "workflow-update"
path = "src/bin/workflow-update.rs"
required-features = ["update-helper"]

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "cookies"] }
sha2 = "0.10"
hex = "0.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
directories = "6"
arboard = "3"
trash = "5"
rfd = "0.15"
open = "5"
fs2 = "0.4"
html-escape = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tray-icon = { version = "0.21", default-features = false }
semver = "1"
ed25519-dalek = "2"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_System_Com", "Win32_UI_Shell"] }
raw-window-handle = "0.6"
winreg = "0.55"
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service"] }
libc = "0.2"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
