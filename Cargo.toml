[package]
name = "workflow-media"
version = "0.5.3"
edition = "2024"
rust-version = "1.95"
description = "WorkFlow Media: portable desktop downloads and media library"
license = "MIT"
build = "build.rs"

[dependencies]
anyhow = "1"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_extras = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "cookies"] }
sha2 = "0.10"
hex = "0.4"
ytdown = { version = "=0.8.1", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util"] }
futures = "0.3"
containr = { version = "=0.1.1", features = ["mp4", "mkv"] }
mp4-atom = "=0.17.0"
symphonia = { version = "0.5.5", features = ["aac", "isomp4", "mp3"] }
shine-rs = "0.1.5"
roxmltree = "0.21"
directories = "6"
arboard = "3"
trash = "5"
rfd = "0.15"
open = "5"
fs2 = "0.4"
html-escape = "0.2"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
tray-icon = { version = "0.21", default-features = false }
semver = "1"
ed25519-dalek = "2"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winreg = "0.55"
clipboard-win = "5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_JobObjects", "Win32_Security", "Win32_Storage_FileSystem"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[patch.crates-io]
shine-rs = { path = "vendor/shine-rs" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
